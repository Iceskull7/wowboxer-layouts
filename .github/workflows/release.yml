name: WoWBoxer Offhand release

on:
  push:
    tags: ['offhand-v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Check fork version and prepare release notes
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $env:GITHUB_REF_NAME -cne "offhand-v$version") {
            throw "Expected offhand-v$version from Directory.Build.props, got $env:GITHUB_REF_NAME."
          }
          $changelog = Get-Content CHANGELOG.md -Raw
          $section = [regex]::Match($changelog, '(?ms)^## Offhand ' + [regex]::Escape($version) + '[^\S\n]*(?:[–-][^\n]*)?\r?\n(?<body>.*?)(?=^## |\z)')
          if (!$section.Success -or !$section.Groups['body'].Value.Trim()) { throw "Missing changelog section for Offhand $version." }
          New-Item -ItemType Directory -Path out/release -Force | Out-Null
          $section.Groups['body'].Value.Trim() | Set-Content out/release-notes.md -Encoding utf8
          "FORK_VERSION=$version" >> $env:GITHUB_ENV
          "ZIP_NAME=WoWBoxer-Offhand-$version-win-x64.zip" >> $env:GITHUB_ENV

      - name: Test the solution
        run: dotnet test WoWBoxer.Layouts.slnx -c Release

      - name: Exercise Offhand with two Windows test clients
        run: dotnet run --project tools/offhand-check -c Release

      - name: Publish self-contained Windows desktop app and CLI
        shell: pwsh
        run: |
          dotnet publish src/WoWBoxer.Layouts.App -c Release -r win-x64 --self-contained true -o out/portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish src/WoWBoxer.Layouts.Cli -c Release -r win-x64 --self-contained true -o out/portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item LICENSE, docs/third-party.md, src/WoWBoxer.Layouts.App/Assets/Fonts/Cinzel-OFL.txt -Destination out/portable

      - name: Package, extract and smoke-test the ZIP
        shell: pwsh
        run: |
          $zip = "out/release/$env:ZIP_NAME"
          Compress-Archive -Path out/portable/* -DestinationPath $zip
          Expand-Archive -LiteralPath $zip -DestinationPath out/smoke
          $version = & ./out/smoke/wbx.exe version
          if ($LASTEXITCODE -ne 0 -or $version -cne $env:FORK_VERSION) { throw "Unexpected CLI version '$version'." }
          ./tools/smoke-start.ps1 -Exe out/smoke/WoWBoxer.exe
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:ZIP_NAME" | Set-Content out/release/SHA256SUMS.txt -Encoding ascii

      - name: Publish the tagged GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME "out/release/$env:ZIP_NAME" out/release/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --verify-tag --title "WoWBoxer Offhand $env:FORK_VERSION" --notes-file out/release-notes.md --latest
